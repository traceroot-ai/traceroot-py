name: Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  typesafe-fresh-install:
    name: TypeSafe fresh install (${{ matrix.instrumentor }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        instrumentor: ["0.1.1", "latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # Install the built wheel without uv.lock, as a new user would.
      - name: Build and install the TypeSafe extra
        shell: bash
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/typesafe-venv" --python 3.11
          wheels=(dist/*.whl)
          install_args=("${wheels[0]}[typesafe]" pytest pytest-asyncio)
          if [[ "${{ matrix.instrumentor }}" != "latest" ]]; then
            install_args+=("openinference-instrumentation-typesafe==${{ matrix.instrumentor }}")
          fi
          uv pip install --python "$RUNNER_TEMP/typesafe-venv/bin/python" "${install_args[@]}"
          uv pip check --python "$RUNNER_TEMP/typesafe-venv/bin/python"

      # Copy only the tests so imports cannot silently use the source checkout.
      - name: Prepare installed-package tests
        run: |
          mkdir -p "$RUNNER_TEMP/typesafe-tests/tests"
          cp tests/{__init__,conftest,utils,test_typesafe,test_auto_instrumentation}.py "$RUNNER_TEMP/typesafe-tests/tests/"

      - name: Verify installed versions and span contract
        working-directory: ${{ runner.temp }}/typesafe-tests
        run: |
          "$RUNNER_TEMP/typesafe-venv/bin/python" -c 'import importlib.metadata as m; import traceroot; print("Installed SDK:", traceroot.__file__); print({p: m.version(p) for p in ("traceroot", "typesafe-sdk", "openinference-instrumentation-typesafe")})'
          "$RUNNER_TEMP/typesafe-venv/bin/python" -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Unit tests
  # ---------------------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        timeout-minutes: 15
        run: |
          uv run coverage run -m pytest tests/ --durations=10
          uv run coverage xml -o coverage.xml
          uv run coverage report

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Coverage summary
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage Report
    runs-on: ubuntu-24.04
    needs: [tests]
    if: needs.tests.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage

      - name: Summarize coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both
          hide_complexity: true

      - name: Print coverage summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
